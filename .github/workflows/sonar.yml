name: sonar

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud-scan:
    name: 'SonarQube / SonarCloud Code Quality Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código (Full History para Blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configurar Java 17 (Requisito SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar Análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: ${{ vars.SONAR_PROJECT || 'MANUEL_DONGO_examen-de-unidad' }}
          SONAR_ORG: ${{ vars.SONAR_ORG || '' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN no configurado en los Secretos del repositorio. Ejecutando compilación y tests sin scanner."
            exit 0
          fi

          ORG_ARG=""
          if [ -n "$SONAR_ORG" ]; then
            ORG_ARG="/o:\"$SONAR_ORG\""
          fi

          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT" \
            $ORG_ARG \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/wwwroot/**,**/dist/**,**/node_modules/**"

      - name: Compilar Solución .NET
        run: dotnet build --configuration Release

      - name: Ejecutar Pruebas con Cobertura OpenCover
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Finalizar y Publicar Escaneo SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
