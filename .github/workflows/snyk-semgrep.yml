name: snyk-semgrep

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-scan:
    name: 'Semgrep SAST Code Security Scan'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep Security Rules
        run: |
          semgrep scan --config=auto --sarif --output=semgrep-results.sarif || true
          semgrep scan --config=auto --text --output=semgrep-report.txt || true

      - name: Subir SARIF a GitHub Security Dashboard
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif

      - name: Archivar Reporte Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-security-report
          path: |
            semgrep-results.sarif
            semgrep-report.txt

  snyk-scan:
    name: 'Snyk Code & Container Security Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Escaneo Snyk Open Source & SAST
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            snyk code test --sarif-file-output=snyk-code.sarif || true
            snyk test --sarif-file-output=snyk-deps.sarif || true
          else
            echo "::warning::SNYK_TOKEN no configurado. Generando stub para evidencias."
            echo '{"version":"2.1.0","runs":[]}' > snyk-code.sarif
            echo '{"version":"2.1.0","runs":[]}' > snyk-deps.sarif
          fi

      - name: Construir Imagen Docker para Análisis de Contenedor
        run: |
          docker build -t exams-api:security-audit -f src/Exams.Api/Dockerfile .

      - name: Escaneo de Vulnerabilidades en Imagen de Contenedor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            snyk container test exams-api:security-audit \
              --file=src/Exams.Api/Dockerfile \
              --sarif-file-output=snyk-container.sarif || true
          else
            echo '{"version":"2.1.0","runs":[]}' > snyk-container.sarif
          fi

      - name: Subir Reportes SARIF de Snyk a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-code.sarif

      - name: Archivar Reportes de Seguridad Snyk
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-security-reports
          path: |
            snyk-code.sarif
            snyk-deps.sarif
            snyk-container.sarif
