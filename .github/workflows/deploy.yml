name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-test:
    name: 'Build & Unit/Integration Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar Dependencias
        run: dotnet restore

      - name: Compilar Solución
        run: dotnet build --no-restore --configuration Release

      - name: Ejecutar Pruebas
        run: dotnet test --no-build --configuration Release --verbosity normal

  deploy-api-container:
    name: 'Build Container & Deploy Backend API'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Iniciar Sesión en Azure CLI (si secrets están definidos)
        uses: azure/login@v2
        if: env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir Imagen Docker
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LOWER}/exams-api:${{ github.sha }}"
          LATEST_TAG="ghcr.io/${OWNER_LOWER}/exams-api:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" -f src/Exams.Api/Dockerfile .

      - name: Publicar Imagen Docker en GHCR (si token está disponible)
        continue-on-error: true
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LOWER}/exams-api:${{ github.sha }}"
          LATEST_TAG="ghcr.io/${OWNER_LOWER}/exams-api:latest"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE_TAG" || true
          docker push "$LATEST_TAG" || true

  deploy-frontend-webapp:
    name: 'Build & Deploy React Frontend'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar Dependencias Frontend
        working-directory: frontend
        run: npm install

      - name: Compilar Frontend para Producción
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_API_URL || '' }}
        run: npm run build

      - name: Archivar Dist para Despliegue (Vercel / Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
